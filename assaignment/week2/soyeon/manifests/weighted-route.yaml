apiVersion: v1
kind: Service
metadata:
  name: nginx-v1
  namespace: netlab
spec:
  selector: {app: nginx-netlab, version: v1}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-v2
  namespace: netlab
spec:
  selector: {app: nginx-netlab, version: v2}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: netlab
spec:
  parentRefs:
    - name: nginx-gateway
      sectionName: http
  hostnames: [nginx.lab.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /nginx}
      backendRefs:
        - {name: nginx-v1, port: 8080, weight: 80}
        - {name: nginx-v2, port: 8080, weight: 20}
